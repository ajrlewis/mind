name: mind

services:
  brain-postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - brain-postgres-data:/var/lib/postgresql/data
      - ./products/brain/docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 2s
      timeout: 5s
      retries: 15

  brain-api:
    build:
      context: .
      dockerfile: products/brain/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql+psycopg://brain:brain@brain-postgres:5432/brain
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-5000}
      LOCAL_BEARER_TOKEN: ${LOCAL_BEARER_TOKEN:-brain-local-dev}
      LOCAL_ORGANIZATION_ID: ${LOCAL_ORGANIZATION_ID:-35982da3-60ae-5eea-b46a-088c3cc0f278}
      LOCAL_PRINCIPAL_ID: ${LOCAL_PRINCIPAL_ID:-7f180c45-c2f9-5f9d-b715-bf68f4ced724}
      LOCAL_GROUP_IDS: ${LOCAL_GROUP_IDS:-["8bde0934-4daa-5afa-a9c3-24e849557486"]}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      brain-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  brain-web:
    build:
      context: .
      dockerfile: products/brain/Dockerfile
      target: web
    environment:
      BRAIN_API_URL: http://brain-api:8000
      LOCAL_BEARER_TOKEN: ${LOCAL_BEARER_TOKEN:-brain-local-dev}
      LOCAL_WEB_USER: ${LOCAL_WEB_USER:-brain-admin}
      LOCAL_WEB_PASSWORD: ${LOCAL_WEB_PASSWORD:-brain-local-dev}
      LOCAL_WEB_SESSION_SECRET: ${LOCAL_WEB_SESSION_SECRET:-brain-local-session-secret}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      brain-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/sign-in').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 2s
      timeout: 5s
      retries: 15

  brain-migrate:
    build:
      context: .
      dockerfile: products/brain/Dockerfile
      target: api
    command: ["alembic", "-c", "products/brain/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://brain:brain@brain-postgres:5432/brain
    depends_on:
      brain-postgres:
        condition: service_healthy
    restart: "no"

  cortex-api:
    build:
      context: .
      dockerfile: products/cortex/Dockerfile
      target: api
    environment:
      BRAIN_URL: http://brain-api:8000
      BRAIN_API_KEY: ${LOCAL_BEARER_TOKEN:-brain-local-dev}
      BRAIN_CONNECT_TIMEOUT_SECONDS: ${BRAIN_CONNECT_TIMEOUT_SECONDS:-2}
      BRAIN_READ_TIMEOUT_SECONDS: ${BRAIN_READ_TIMEOUT_SECONDS:-5}
      MODEL_BACKEND: deterministic
      CORTEX_DATABASE_URL: postgresql+psycopg://brain:brain@brain-postgres:5432/cortex
      CORTEX_LOCAL_BEARER_TOKEN: ${CORTEX_LOCAL_BEARER_TOKEN:-cortex-local-dev}
      CORTEX_LOCAL_OWNER_ID: ${CORTEX_LOCAL_OWNER_ID:-cortex-local-user}
    ports:
      - "${CORTEX_API_PORT:-8100}:8000"
    depends_on:
      cortex-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  cortex-migrate:
    build:
      context: .
      dockerfile: products/cortex/Dockerfile
      target: api
    command: ["alembic", "-c", "products/cortex/alembic.ini", "upgrade", "head"]
    environment:
      CORTEX_DATABASE_URL: postgresql+psycopg://brain:brain@brain-postgres:5432/cortex
    depends_on:
      cortex-db-init:
        condition: service_completed_successfully
    restart: "no"

  cortex-db-init:
    image: pgvector/pgvector:pg17
    environment:
      PGPASSWORD: brain
    command:
      [
        "sh",
        "-c",
        "psql -h brain-postgres -U brain -d brain -tAc \"SELECT 1 FROM pg_database WHERE datname='cortex'\" | grep -q 1 || createdb -h brain-postgres -U brain -O brain cortex",
      ]
    depends_on:
      brain-postgres:
        condition: service_healthy
    restart: "no"

  cortex-web:
    build:
      context: .
      dockerfile: products/cortex/Dockerfile
      target: web
    environment:
      CORTEX_API_URL: http://cortex-api:8000
      CORTEX_API_BEARER_TOKEN: ${CORTEX_LOCAL_BEARER_TOKEN:-cortex-local-dev}
      CORTEX_WEB_USER: ${CORTEX_WEB_USER:-cortex-user}
      CORTEX_WEB_PASSWORD: ${CORTEX_WEB_PASSWORD:-cortex-local-dev}
      CORTEX_WEB_SESSION_SECRET: ${CORTEX_WEB_SESSION_SECRET:-cortex-local-session-secret}
    ports:
      - "${CORTEX_WEB_PORT:-3100}:3000"
    depends_on:
      cortex-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/sign-in').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  brain-postgres-data:
