name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.6"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --frozen --all-packages
      - run: npm ci
      - run: npm run web:contracts:check
      - run: npm run web:lint
      - run: npm run web:typecheck
      - run: npm run web:test
      - run: npm run web:build
      - run: npm run cortex:web:lint
      - run: npm run cortex:web:typecheck
      - run: npm run cortex:web:test
      - run: npm run cortex:web:build
      - run: docker compose up -d --build
      - run: docker compose exec -T brain-api brain-seed-northstar
      - run: CORTEX_TEST_URL=http://127.0.0.1:8100 uv run pytest products/cortex/tests/e2e/test_brain_boundary.py
      - run: CORTEX_TEST_URL=http://127.0.0.1:8100 uv run pytest products/cortex/tests/e2e/test_chat_turn.py products/cortex/tests/e2e/test_conversations.py
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @brain/web
      - run: npm run test:e2e --workspace @cortex/web
      - if: always()
        run: docker compose down

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: brain
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brain -d brain"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://brain:brain@localhost:5432/brain
      CORTEX_TEST_DATABASE_URL: postgresql://brain:brain@localhost:5432/cortex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.6"
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: psql "$TEST_DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: createdb -h localhost -U brain -O brain cortex
        env:
          PGPASSWORD: brain
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: products/brain/Dockerfile
          target: api
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: products/brain/Dockerfile
          target: web
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: products/cortex/Dockerfile
          target: api
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: products/cortex/Dockerfile
          target: web
          push: false
